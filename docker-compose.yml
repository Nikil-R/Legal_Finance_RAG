version: '3.8'

services:
  # FastAPI Backend - RAG Pipeline
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legalfinance-api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - LOG_LEVEL=INFO
      - ENVIRONMENT=${ENVIRONMENT:-local}
    volumes:
      - chroma_data:/app/chroma_db
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - legalfinance-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
    container_name: legalfinance-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - legalfinance-network

volumes:
  chroma_data:
    name: legalfinance-chroma-data

networks:
  legalfinance-network:
    name: legalfinance-network
    driver: bridge
